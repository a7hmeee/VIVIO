<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&amp;display=swap');
      .main-text {
        font-family: 'Cairo', 'Arial', sans-serif;
        font-size: 64px;
        font-weight: 900;
        fill: white;
        direction: rtl;
      }
      .number-text {
        font-family: 'Cairo', 'Arial', sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #1a73e8;
        direction: rtl;
      }
      .highlight-box {
        fill: none;
        stroke: #3d5a99;
        stroke-width: 2;
        rx: 4;
        ry: 4;
      }
      .highlight-text {
        font-family: 'Cairo', 'Arial', sans-serif;
        font-size: 64px;
        font-weight: 900;
        fill: white;
        direction: rtl;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="400" fill="#1a1a2e"/>
  
  <!-- Number .01 top right -->
  <text x="650" y="50" class="number-text" text-anchor="end">.01</text>
  
  <!-- Top line text -->
  <text x="350" y="120" class="main-text" text-anchor="middle">
    نبني نظامه رقمه
  </text>
  
  <!-- Middle line text -->
  <text x="350" y="210" class="main-text" text-anchor="middle">
    تحلي شغعلك
  </text>
  
  <!-- Blue box around أسهعل -->
  <rect x="75" y="255" width="190" height="90" class="highlight-box"/>
  
  <!-- Highlighted text أسهعل with period -->
  <text x="170" y="325" class="highlight-text" text-anchor="middle">
    أسهعل.
  </text>
</svg>